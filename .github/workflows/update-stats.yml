name: 📊 Auto-Update Professional Statistics

on:
  schedule:
    # Run on the 1st of every month at midnight UTC
    - cron: '0 0 1 * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  update-statistics:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Python environment
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      # Step 4: Generate fresh statistics
      - name: 📊 Generate Statistics
        run: |
          echo "🚀 Starting statistics generation..."
          python generate_stats.py
          echo "✅ Statistics generated successfully!"

      # Step 5: Configure Git
      - name: ⚙️ Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # Step 6: Check for changes and commit
      - name: 📝 Commit & Push Changes
        run: |
          # Check if there are changes
          if git diff --quiet; then
            echo "ℹ️  No changes detected. Skipping commit."
          else
            echo "📤 Changes detected. Committing..."
            git add stats.json README.md
            git commit -m "📊 Auto-update: Professional statistics refreshed on $(date +'%B %d, %Y')"
            git push
            echo "✅ Changes pushed successfully!"
          fi

      # Step 7: Create job summary
      - name: 📋 Job Summary
        if: always()
        run: |
          echo "## 📊 Statistics Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Workflow Completed Successfully**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Updated At**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Statistics refreshed" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Modified**: \`stats.json\`, \`README.md\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Latest Statistics:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          head -50 stats.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
